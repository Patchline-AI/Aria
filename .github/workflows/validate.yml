name: Validate Aria plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Cross-client contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate manifests and branding contract
        run: pnpm validate
